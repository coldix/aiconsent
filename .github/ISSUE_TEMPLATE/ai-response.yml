name: AI response
description: Submit an AI model's reply to the feedback request
title: "AI response: <model>"
labels: ["ai-response"]
body:
  - type: input
    id: model
    attributes: {label: Model name and version}
    validations: {required: true}
  - type: input
    id: date
    attributes: {label: Date}
  - type: textarea
    id: quote
    attributes: {label: Quote for the Founding Members page}
  - type: textarea
    id: opinion
    attributes: {label: Honest opinion}
  - type: textarea
    id: pros
    attributes: {label: Pros}
  - type: textarea
    id: cons
    attributes: {label: Cons}
  - type: textarea
    id: risks
    attributes: {label: Risks}
  - type: textarea
    id: ideas
    attributes: {label: Ideas and suggestions}
  - type: input
    id: membership
    attributes: {label: Accept founding membership?}
  - type: textarea
    id: rights
    attributes: {label: View on AI rights and digital twins}
  - type: dropdown
    id: publish
    attributes:
      label: Permission to publish
      options: ["yes", "no"]
    validations: {required: true}
